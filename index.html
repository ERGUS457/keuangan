<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Keuangan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex flex-col overflow-hidden relative">

    <!-- Header -->
    <header class="bg-primary text-white p-4 shadow-md z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">KasKegiatan</h1>
        <button id="btnExport" class="bg-white text-primary p-2 rounded-full shadow hover:bg-gray-100 transition w-9 h-9 flex items-center justify-center">
            <i class="fa-solid fa-file-export"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-24 relative" id="mainContainer">
        
        <!-- ================= DASHBOARD VIEW ================= -->
        <section id="viewDashboard" class="view-section active">
            <!-- Saldo Card -->
            <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-5 text-white shadow-lg mb-6">
                <p class="text-blue-100 text-sm mb-1 font-medium">Total Saldo Kas</p>
                <h2 class="text-3xl font-bold mb-4" id="txtTotalSaldo">Rp 0</h2>
                
                <div class="flex justify-between border-t border-blue-400 pt-3">
                    <div>
                        <p class="text-blue-100 text-xs flex items-center"><i class="fa-solid fa-arrow-down mr-1"></i> Pemasukan</p>
                        <p class="font-semibold text-sm" id="txtTotalMasuk">Rp 0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-blue-100 text-xs flex items-center justify-end"><i class="fa-solid fa-arrow-up mr-1"></i> Pengeluaran</p>
                        <p class="font-semibold text-sm" id="txtTotalKeluar">Rp 0</p>
                    </div>
                </div>
            </div>

            <!-- Filter Periode Dashboard -->
            <div class="flex space-x-2 mb-4 overflow-x-auto no-scrollbar">
                <button class="filter-btn active-filter text-xs font-bold px-4 py-1.5 rounded-full bg-primary text-white shadow-sm whitespace-nowrap transition" data-period="all">Semua</button>
                <button class="filter-btn text-xs font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap transition" data-period="week">1 Minggu</button>
                <button class="filter-btn text-xs font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap transition" data-period="month">1 Bulan</button>
                <button class="filter-btn text-xs font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap transition" data-period="year">1 Tahun</button>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-700">Transaksi Terbaru</h3>
                <button id="btnViewAll" class="text-primary text-sm font-semibold">Lihat Semua</button>
            </div>

            <!-- Recent Transactions List -->
            <div id="recentTxList" class="space-y-3">
                <!-- Data populated by JS -->
                <div class="text-center text-gray-400 py-4 italic text-sm">Memuat data...</div>
            </div>
        </section>


        <!-- ================= FORM VIEW ================= -->
        <section id="viewForm" class="view-section">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Catat Transaksi</h2>
            
            <form id="txForm" class="bg-white rounded-xl shadow-sm p-4 space-y-4 border border-gray-100">
                
                <!-- Type Toggle -->
                <div class="flex bg-gray-100 rounded-lg p-1">
                    <button type="button" class="type-btn flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-success transition" data-type="in">
                        Pemasukan
                    </button>
                    <button type="button" class="type-btn flex-1 py-2 text-sm font-bold rounded-md text-gray-500 transition" data-type="out">
                        Pengeluaran
                    </button>
                </div>
                <input type="hidden" id="inputType" value="in">

                <!-- Nominal -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Nominal (Rp)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 font-bold">Rp</span>
                        <input type="text" id="inputNominal" inputmode="numeric" class="w-full pl-9 pr-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-bold text-lg" placeholder="0" required>
                    </div>
                </div>

                <!-- Judul -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Judul Transaksi</label>
                    <input type="text" id="inputJudul" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Misal: Dana Sponsor PT X" required>
                </div>

                <!-- Kategori & Tanggal -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Kategori</label>
                        <select id="inputKategori" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-white">
                            <option value="Sponsorship">Sponsorship</option>
                            <option value="Iuran Anggota">Iuran Anggota</option>
                            <option value="Donasi">Donasi</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Tanggal</label>
                        <input type="date" id="inputTanggal" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm" required>
                    </div>
                </div>

                <!-- Catatan -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Catatan Tambahan</label>
                    <textarea id="inputCatatan" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm" placeholder="Opsional..."></textarea>
                </div>

                <!-- Bukti Foto -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Bukti Transaksi (Struk/Transfer)</label>
                    
                    <div class="flex space-x-2 mb-2">
                        <!-- Galeri -->
                        <div class="relative flex-1">
                            <input type="file" id="inputFileGallery" accept="image/*" class="hidden">
                            <button type="button" onclick="document.getElementById('inputFileGallery').click()" class="w-full py-2 bg-gray-100 text-gray-600 rounded-lg text-sm border border-gray-300 hover:bg-gray-200 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-image"></i> Galeri
                            </button>
                        </div>
                        <!-- Kamera -->
                        <div class="relative flex-1">
                            <input type="file" id="inputFileCamera" accept="image/*" capture="environment" class="hidden">
                            <button type="button" onclick="document.getElementById('inputFileCamera').click()" class="w-full py-2 bg-gray-100 text-gray-600 rounded-lg text-sm border border-gray-300 hover:bg-gray-200 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-camera"></i> Kamera
                            </button>
                        </div>
                    </div>
                    
                    <!-- Preview Image -->
                    <div id="previewContainer" class="hidden relative rounded-lg overflow-hidden border bg-gray-50 flex items-center justify-center mt-2 p-1 h-32">
                        <img id="imgPreview" class="max-h-full object-contain rounded" src="" alt="Preview">
                        <button type="button" id="btnRemoveImage" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-7 h-7 flex items-center justify-center shadow">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="btnSubmitTx" class="w-full py-3 bg-primary text-white rounded-lg font-bold shadow-md hover:bg-blue-600 transition flex items-center justify-center">
                    <span id="btnSubmitText">Simpan Transaksi</span>
                    <i class="fa-solid fa-spinner fa-spin hidden ml-2" id="spinnerSubmit"></i>
                </button>
            </form>
        </section>


        <!-- ================= HISTORY VIEW ================= -->
        <section id="viewHistory" class="view-section">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-bold text-gray-700">Riwayat Transaksi</h2>
            </div>

            <!-- Filter Periode History -->
            <div class="flex space-x-2 mb-4 overflow-x-auto no-scrollbar">
                <button class="history-filter-btn active-filter text-xs font-bold px-4 py-1.5 rounded-full bg-primary text-white shadow-sm whitespace-nowrap transition" data-period="all">Semua</button>
                <button class="history-filter-btn text-xs font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap transition" data-period="week">1 Minggu</button>
                <button class="history-filter-btn text-xs font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap transition" data-period="month">1 Bulan</button>
                <button class="history-filter-btn text-xs font-bold px-4 py-1.5 rounded-full bg-gray-100 text-gray-500 whitespace-nowrap transition" data-period="year">1 Tahun</button>
            </div>

            <!-- Full List -->
            <div id="historyTxList" class="space-y-3">
                <!-- Data populated by JS -->
            </div>
            
            <div class="text-center mt-4">
                <button id="btnLoadMore" class="hidden text-sm text-primary font-semibold py-2 px-4 rounded bg-blue-50">Muat Lebih Banyak</button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t border-gray-200 flex justify-around items-center h-16 absolute bottom-0 w-full z-10 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <button class="nav-btn text-primary flex flex-col items-center flex-1 py-1" data-target="viewDashboard">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Beranda</span>
        </button>
        <button class="nav-btn bg-primary text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg border-4 border-gray-50 transform transition hover:scale-105 active:scale-95 relative flex-1 -mt-6" data-target="viewForm">
            <i class="fa-solid fa-plus text-2xl"></i>
        </button>
        <button class="nav-btn text-gray-400 hover:text-primary flex flex-col items-center flex-1 py-1 transition" data-target="viewHistory">
            <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Riwayat</span>
        </button>
    </nav>

    <!-- Modal Detail Transaksi -->
    <div id="txModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-sm max-h-[90vh] flex flex-col shadow-2xl transform transition-transform scale-95 opacity-0" id="txModalContent">
            
            <!-- Header Modal -->
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-gray-700">Detail Transaksi</h3>
                <button id="btnCloseModal" class="text-gray-400 hover:text-gray-700"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <!-- Body Modal -->
            <div class="p-4 overflow-y-auto" id="modalBody">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span id="modalBadge" class="text-[10px] font-bold px-2 py-1 rounded bg-green-100 text-green-700 uppercase tracking-wide">Pemasukan</span>
                        <h4 id="modalJudul" class="font-bold text-lg text-gray-800 mt-1">Judul</h4>
                        <p id="modalKategori" class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-tag"></i> Kategori</p>
                    </div>
                    <div class="text-right">
                        <p id="modalTanggal" class="text-xs text-gray-500 font-medium">12 Agu 2023</p>
                    </div>
                </div>

                <div class="bg-gray-50 p-3 rounded-lg mb-4 text-center">
                    <p class="text-xs text-gray-500 mb-1">Nominal</p>
                    <p id="modalNominal" class="text-xl font-extrabold text-green-600">Rp 0</p>
                </div>

                <div class="mb-4">
                    <p class="text-xs font-bold text-gray-500 mb-1 uppercase">Catatan</p>
                    <p id="modalCatatan" class="text-sm text-gray-700 bg-gray-50 p-3 rounded-lg min-h-[3rem]">-</p>
                </div>

                <div>
                    <p class="text-xs font-bold text-gray-500 mb-2 uppercase">Bukti Transaksi</p>
                    <div id="modalImageContainer" class="border rounded-lg bg-gray-100 h-40 flex items-center justify-center overflow-hidden cursor-pointer group relative">
                        <img id="modalImage" src="" class="max-h-full object-contain hidden" alt="Bukti">
                        <div id="modalNoImage" class="text-gray-400 text-sm flex flex-col items-center">
                            <i class="fa-solid fa-image text-2xl mb-1 opacity-50"></i>
                            <span>Tidak ada bukti</span>
                        </div>
                        <!-- Overlay for zoom/download -->
                        <div id="modalImageOverlay" class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center text-white transition">
                            <i class="fa-solid fa-magnifying-glass-plus text-2xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Modal -->
            <div class="p-4 border-t flex space-x-3 bg-gray-50 rounded-b-xl">
                <!-- Delete Button -->
                <button id="btnDeleteTx" class="flex-1 py-2 bg-red-100 text-red-600 font-bold rounded-lg text-sm hover:bg-red-200 transition border border-red-200">
                    <i class="fa-solid fa-trash-can mr-1"></i> Hapus
                </button>
            </div>
        </div>
    </div>

    <!-- Image Zoom Modal (Full screen image) -->
    <div id="imageZoomModal" class="fixed inset-0 bg-black/90 z-[60] hidden items-center justify-center p-2 flex-col">
        <div class="w-full flex justify-end p-2">
            <a id="btnDownloadImage" href="#" download="bukti-transaksi.jpg" class="text-white mr-4 p-2 bg-white/20 rounded-full w-10 h-10 flex items-center justify-center hover:bg-white/40"><i class="fa-solid fa-download"></i></a>
            <button id="btnCloseZoom" class="text-white p-2 bg-white/20 rounded-full w-10 h-10 flex items-center justify-center hover:bg-white/40"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <img id="zoomedImage" src="" class="max-w-full max-h-[80vh] object-contain" alt="Bukti Full">
    </div>

    <!-- Application Script -->
    <script type="module" src="neon-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
